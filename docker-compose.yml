version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: job_analyzer_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: job_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
